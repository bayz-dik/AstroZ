  <circle cx="1010" cy="250" r="200" fill="url(#halo)" filter="url(#soft)"/>

  <!-- inti: satu simpul, dengan satu satelit yang mengelilinginya -->
  <g transform="translate(250,200)">
    <ellipse rx="168" ry="62" fill="none" stroke="url(#ring)" stroke-width="1.2"
